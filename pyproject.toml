[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowanalysis-desktop"
version = "0.1.0"
description = "Local bilingual cytometry analysis for macOS and Windows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-only"
dependencies = [
  "PySide6==6.8.3", "pyqtgraph>=0.13.7,<0.15", "flowkit>=1.2,<2",
  "numpy>=2,<3", "scipy>=1.14,<2", "pandas>=2.2,<3",
  "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2", "umap-learn>=0.5.7,<0.6",
  "flowsom>=0.2,<0.3", "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "pyinstaller>=6.12", "ruff>=0.9"]

[project.scripts]
flowanalysis = "flowanalysis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
