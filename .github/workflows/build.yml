name: Test and build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts packaging
      - run: python scripts/download_test_data.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/build.py
      - name: Frozen application smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/FlowAnalysis.app/Contents/MacOS/FlowAnalysis --self-test frozen-smoke.json
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Frozen application smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/FlowAnalysis/FlowAnalysis.exe -ArgumentList '--self-test','frozen-smoke.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen smoke test failed" }
          if (!(Test-Path frozen-smoke.json)) { throw "Smoke report missing" }
          Get-Content frozen-smoke.json
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: FlowAnalysis-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*Setup.exe
            frozen-smoke.json
