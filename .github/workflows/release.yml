name: Publish tested desktop build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful desktop build run ID
        required: true
      tag:
        description: New release tag
        required: true
        default: v0.1.0
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-artifacts
      - run: python scripts/publish_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
